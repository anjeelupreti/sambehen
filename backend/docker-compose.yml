# Pinned so the project name does not follow the directory name. Compose
# defaults it to the containing folder — which is `backend` here — and that
# would create a second set of empty volumes while orphaning the real ones.
name: sambehen

services:
  # ── NestJS application ──────────────────────────────────────────────
  # For local development prefer `docker compose up -d db redis` and run
  # the app on the host with `npm run start:dev`, so hot reload works.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sambehen-app
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    # env_file supplies everything else; only the values that must differ
    # inside the compose network are overridden here.
    env_file:
      - .env
    environment:
      APP_PORT: 3000
      APP_HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EXPORT_STORAGE_PATH: /app/storage/exports
    volumes:
      # Generated .xlsx/.csv exports must survive container replacement.
      - exports:/app/storage/exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sambehen

  # ── PostgreSQL ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sambehen-db
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-sambehen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-sambehen}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - sambehen

  # ── Redis (cache, throttling, presence) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sambehen-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sambehen

networks:
  sambehen:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  exports:
